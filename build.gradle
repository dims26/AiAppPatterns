plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dims'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// langchain4j
	implementation platform('dev.langchain4j:langchain4j-bom:1.16.3')
	implementation 'dev.langchain4j:langchain4j-spring-boot4-starter'
	implementation 'dev.langchain4j:langchain4j-open-ai-spring-boot4-starter'
	implementation 'dev.langchain4j:langchain4j-easy-rag'
	//apache commons io, force >=2.17
	implementation 'commons-io:commons-io:2.22.0'

	//opencsv
	implementation 'com.opencsv:opencsv:5.12.0'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
